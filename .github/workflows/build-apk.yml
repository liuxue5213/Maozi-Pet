# ============================================================
# 帽子AI宠物 - Android APK 打包工作流（通过 EAS Build 云端构建）
# 触发方式: 手动触发（workflow_dispatch）或推送 tag（v*）
# 产物: 在 Actions 页面的 Artifacts 中下载 maozi-pet-apk
# 前置要求:
#   1. 仓库 Settings → Secrets 配置 EXPO_TOKEN（Expo 访问令牌）
#   2. 首次使用前在本地执行一次 `eas build:configure` 初始化 EAS 项目
#   3. 修改 frontend/eas.json 中 preview/production 的 EXPO_PUBLIC_API_BASE_URL
#      指向你的真实服务器地址（否则 App 连不上后端）
# ============================================================

name: Build Android APK

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'           # 推送版本 tag 时自动构建

jobs:
  build-android:
    name: 📦 构建 Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # EAS 需要完整 git 历史用于版本号

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 安装前端依赖
        run: npm ci

      - name: 🔧 安装 EAS CLI
        run: npm install -g eas-cli

      - name: ✅ 校验 EAS 登录态
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ 构建 Android APK（云端，阻塞直到完成）
        run: eas build -p android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 获取构建产物下载地址
        id: artifact
        run: |
          BUILD_JSON=$(eas build:list --json --limit 1 --status finished --non-interactive)
          # applicationDownloadUrl 才是真实 APK/AAB 文件地址；buildUrl 只是构建详情网页
          ARTIFACT_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.applicationDownloadUrl // .[0].artifacts.buildUrl')
          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" = "null" ]; then
            echo "❌ 未获取到 APK 下载地址"
            exit 1
          fi
          echo "url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: ⬇️ 下载 APK
        run: |
          mkdir -p ./apk
          wget -q "${{ steps.artifact.outputs.url }}" -O "./apk/maozi-pet.apk"

      - name: 📤 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: maozi-pet-apk
          path: frontend/apk/maozi-pet.apk
          retention-days: 30

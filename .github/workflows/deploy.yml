# ============================================================
# 帽子AI宠物 - CD 部署工作流
# 触发条件: push 到 main 分支（后端构建成功后自动部署）
# 部署目标: GitHub Secrets 中配置的服务器 (SSH)
# 安全说明: 所有连接信息通过 GitHub Secrets 注入
# ============================================================

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:  # 也支持手动触发

jobs:
  deploy-backend:
    name: 🚀 部署后端
    runs-on: ubuntu-latest
    needs: []  # 独立运行，不依赖 build job（build 在 PR 时跑）

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📥 安装后端依赖
        working-directory: backend
        # 必须安装完整依赖：build 脚本依赖 devDependencies 中的 typescript。
        # 服务器上的生产依赖由后续 SSH 步骤中服务器的 npm ci --omit=dev 负责。
        run: npm ci

      - name: 🏗️ 构建后端
        working-directory: backend
        run: npm run build
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          BAILIAN_BASE_URL: ${{ secrets.BAILIAN_BASE_URL }}
          BAILIAN_MODEL: ${{ secrets.BAILIAN_MODEL || 'qwen-plus' }}
          SERVER_PORT: '60235'
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: 🚀 SSH 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            echo "🐱 开始部署 帽子AI宠物 后端..."

            # 创建项目目录
            mkdir -p /opt/maozi-pet/backend
            cd /opt/maozi-pet/backend

            # 备份当前版本（保留最近 3 个）
            if [ -f package.json ]; then
              BACKUP_DIR="backup_$(date +%Y%m%d_%H%M%S)"
              mkdir -p /opt/maozi-pet/backups
              cp -r dist package.json /opt/maozi-pet/backups/$BACKUP_DIR 2>/dev/null || true
              cd /opt/maozi-pet/backups && ls -t | tail -n +4 | xargs rm -rf 2>/dev/null || true
            fi

            echo "✅ 后端部署准备完成"

      - name: 📤 上传构建产物
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "backend/dist,backend/package.json,backend/package-lock.json"
          target: "/opt/maozi-pet/backend/"
          strip_components: 1

      - name: 🔄 重启后端服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            cd /opt/maozi-pet/backend

            # 安装生产依赖
            npm ci --omit=dev

            # 写入环境变量文件（从 GitHub Secrets 注入）
            cat > .env << 'ENVEOF'
            NODE_ENV=production
            SERVER_PORT=60235
            BUILD_SHA=${{ github.sha }}
            BAILIAN_API_KEY=${{ secrets.BAILIAN_API_KEY }}
            BAILIAN_BASE_URL=${{ secrets.BAILIAN_BASE_URL }}
            BAILIAN_MODEL=${{ secrets.BAILIAN_MODEL || 'qwen-plus' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || '*' }}
            ENVEOF

            # 使用 PM2 重启（如未安装则自动安装）
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # 关键：删除旧进程登记后按【本目录的绝对路径】重新启动。
            # 旧进程可能登记的是早期手动部署的其它目录，pm2 restart 会一直跑旧代码
            # （症状：部署全绿但线上路由不更新），故此处不做 describe 分支，统一重建。
            pm2 delete maozi-pet-backend > /dev/null 2>&1 || true
            pm2 start /opt/maozi-pet/backend/dist/index.js --name maozi-pet-backend --cwd /opt/maozi-pet/backend

            # 保存 PM2 进程列表
            pm2 save

            # 部署后自检：服务必须在本机应答健康检查，否则本工作流失败（不再假阳性）
            sleep 3
            curl -sf http://127.0.0.1:60235/api/health > /dev/null || {
              echo "❌ 健康检查失败，pm2 状态如下"; pm2 status; pm2 logs maozi-pet-backend --lines 30 --nostream; exit 1;
            }
            echo "🎉 后端部署完成（build ${{ github.sha }}）！"
            pm2 status

  # --- 前端 Web 部署（可选） ---
  deploy-frontend-web:
    name: 🌐 部署前端 Web
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 🏗️ 构建 Web
        working-directory: frontend
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: 📤 上传 Web 构建产物
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "frontend/dist/*"
          target: "/opt/maozi-pet/frontend/"
          strip_components: 1

      - name: 🔄 重启 Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # 重载 Nginx 配置
            if command -v nginx &> /dev/null; then
              nginx -s reload
              echo "✅ Nginx 已重载"
            else
              echo "⚠️ Nginx 未安装，跳过"
            fi
